[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netcoin"
version = "0.1.0"
description = "Interactive analytic networks for coincidences (Python port of the R package netCoin)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }
authors = [
  { name = "Modesto Escobar" },
  { name = "David Barrios" },
  { name = "Carlos Prieto" },
  { name = "Luis Martinez-Uribe" },
]
keywords = ["network", "javascript", "d3", "coincidence analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["pandas", "numpy", "scipy"]

[project.optional-dependencies]
igraph = ["igraph"]
dev = ["pytest"]

[project.urls]
Homepage = "https://sociocav.usal.es/blog/nca/"
Repository = "https://github.com/Modesto-Escobar/netcoin.py"

[tool.setuptools]
packages = ["netcoin"]
include-package-data = true

[tool.setuptools.package-data]
netcoin = ["www/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
